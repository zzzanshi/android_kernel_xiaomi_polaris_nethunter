name: Build Kernel

on:
  push:
    branches: [ lineage-21 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev python3 python-is-python3 gcc-arm-linux-gnueabi

      - name: Download Clang
        run: |
          mkdir -p clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250101-release/Clang-20.0.0git-20250101.tar.gz
          tar -xf Clang-20.0.0git-20250101.tar.gz -C clang

      - name: Build kernel
        run: |
          rm -f $PWD/clang/bin/as $PWD/clang/bin/ld
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE_ARM32=arm-linux-gnueabi-
          make O=out ARCH=arm64 CC=clang LD=aarch64-linux-gnu-ld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip polaris-miku_defconfig
          make O=out ARCH=arm64 CC=clang LD=aarch64-linux-gnu-ld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip KCFLAGS="-w" -j$(nproc)

      - name: Package NetHunter kernel zip
        run: |
          git clone --depth=1 --branch=2024.3 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-project.git

          mkdir -p kali-nethunter-project/nethunter-installer/devices/thirteen/polaris
          mkdir -p kali-nethunter-project/nethunter-installer/devices/thirteen/polaris/modules/system/lib/modules

          cat > kali-nethunter-project/nethunter-installer/devices/devices.cfg <<'EOF'
          # Xiaomi Mix 2s / polaris
          [polaris]
          author = "Takaken"
          arch = arm64
          version = "docker-cgroup"
          flasher = anykernel
          modules = 0
          slot_device = 0
          block = /dev/block/bootdevice/by-name/boot
          devicenames = polaris,mix2s
          EOF

          cp out/arch/arm64/boot/Image.gz-dtb kali-nethunter-project/nethunter-installer/devices/thirteen/polaris/Image.gz-dtb

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image kali-nethunter-project/nethunter-installer/devices/thirteen/polaris/Image
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz kali-nethunter-project/nethunter-installer/devices/thirteen/polaris/Image.gz
          fi

          cd kali-nethunter-project/nethunter-installer
          python3 build.py -d polaris --thirteen --kernel

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image
          path: out/arch/arm64/boot/Image.gz-dtb

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: polaris-nethunter-kernel-zip
          path: kali-nethunter-project/nethunter-installer/*.zip
